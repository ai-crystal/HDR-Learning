<h1 id="hdr">第三篇　标准篇：HDR 世界的规则</h1>
<blockquote>
<p>“标准的意义，是让一段信号在任何人手里，都能变回同一种光。”</p>
</blockquote>
<p>有了 PQ 与 HLG 这两把尺子，接下来要解决的是“怎么用”：如何把一段 HDR 信号编码、打包、加上说明，再原样还原出来。这就是 HDR 世界的一整套规则——从 HDR10 的静态元数据，到杜比视界与 HDR10+ 的动态元数据，再到位深、编码与色度采样。</p>
<p>这一篇会回答几个最实际的问题：为什么 HDR 要“10bit 起步”？“静态元数据”和“动态元数据”差在哪里？杜比视界凭什么更贵？读完你就能看懂片源、设备上那一串 HDR 标识的真正含义。</p>
</main>
