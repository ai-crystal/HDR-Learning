<h1 id="hdr">第五篇　传输与系统篇：把 HDR 送到眼前</h1>
<blockquote>
<p>“再好的画面，也得先有根‘水管’能把它搬过去。”</p>
</blockquote>
<p>这一篇处理最容易被忽视、却最常出问题的一环：从显卡到屏幕的那条路。接口带宽够不够？线材是不是“旧瓶装新酒”？两个设备怎么“对上话”，又是谁在中间把关（HDCP）？最后，落到你每天要动手的地方——Windows、macOS、游戏主机与手机上的 HDR 该怎么设、为什么桌面会发灰。</p>
<p>读完这一篇，你就能回答那个最经典的疑问：“我明明买了 HDR 屏，为什么没效果？”——答案往往就藏在这条链路的某一环里。</p>
