<h1 id="_1">第二篇　色彩科学篇：颜色的物理与数学</h1>
<blockquote>
<p>“如果说画面是语言，那么色彩科学就是它的语法。”</p>
</blockquote>
<p>第一篇回答的是“为什么”，这一篇要回答“是什么”——颜色究竟如何被准确地描述、计算和传递。听起来很学术，但请放心：我们会用地图、颜料盘、压缩包这些日常事物，把色度图、色域、Gamma 和传递函数一个个讲透。</p>
<p>这一篇的核心，是 HDR 的两把尺子：<strong>PQ</strong> 与 <strong>HLG</strong>。理解了它们，你就能看懂后面所有标准之间的差异，也能明白为什么同一个视频，在不同的屏幕上会有不同的观感。</p>
<p>这一篇稍微硬核，但它是整本文的地基。慢慢读，读不懂就跳回来重读——它值得。</p>
</main>
